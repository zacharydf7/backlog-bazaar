<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/coins/mint.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The page's color for the browser's own bars (Chrome on Android paints
         the phone's back/home bar with it); kept in step with the theme by
         syncThemeColor in src/lib/theme.ts. The default is Midnight's
         --canvas (src/index.css), so change both together. -->
    <meta name="theme-color" content="#131a2b" />
    <title>Backlog Bazaar</title>
    <!-- Apply the saved (or system-derived) theme before paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bb-theme") || "midnight";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
