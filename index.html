<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/coins/mint.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The page's color for the browser's own bars (Chrome on Android paints
         the phone's back/home bar with it); kept in step with the theme by
         syncThemeColor in src/lib/theme.ts. The default is Midnight's
         --canvas (src/index.css), so change it together with that and the
         colors in public/manifest.webmanifest. -->
    <meta name="theme-color" content="#131a2b" />
    <!-- Installable app (issue fae311ea): a home-screen launch opens full
         screen with the theme's colors on the phone's bars. The icon PNGs are
         rendered from public/icons/app-icon.svg, which wraps
         public/coins/mint.svg on Midnight's canvas: if the coin art changes,
         update the SVG and re-render the 192px and 512px PNGs by hand. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Backlog Bazaar</title>
    <!-- Apply the saved (or system-derived) theme before paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bb-theme") || "midnight";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
